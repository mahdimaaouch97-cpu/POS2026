<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المشتركين - POSNEW</title>

<style>
* { box-sizing: border-box; }
body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #eef1f5; margin:0; padding:20px; direction:rtl; color:#333; }
h1 { text-align:center; margin-bottom:25px; color:#222; }

/* Buttons */
.top-buttons { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:20px; }
.top-buttons button { padding:10px 18px; border-radius:8px; border:none; cursor:pointer; font-weight:bold; background:#0d6efd; color:white; transition:0.2s; }
.top-buttons button:hover { opacity:0.85; transform:translateY(-1px); }

/* Search & Filter */
.search-filter { max-width:500px; margin:0 auto 20px; display:flex; gap:10px; }
.search-filter input, .search-filter select { padding:10px; border-radius:8px; border:1px solid #ccc; flex:1; }

/* Add Form */
.add-form { max-width:520px; margin:0 auto 25px; background:#fff; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.08); }
.add-form input { width:100%; padding:10px; margin-bottom:12px; border-radius:8px; border:1px solid #ccc; }
.add-form button { width:100%; padding:12px; border-radius:8px; border:none; background:#198754; color:white; font-size:15px; cursor:pointer; }
.add-form button:hover { opacity:0.9; }

/* Table */
table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.08); }
th { background:#0d6efd; color:white; padding:12px; font-size:14px; }
td { padding:10px; border-bottom:1px solid #eee; text-align:center; font-size:14px; }
tr:hover { background:#f5f8ff; }

/* Status */
.status-full { background:#198754; color:white; padding:4px 8px; border-radius:6px; }
.status-partial { background:#fd7e14; color:white; padding:4px 8px; border-radius:6px; }
.status-unpaid { background:#dc3545; color:white; padding:4px 8px; border-radius:6px; }

/* Action Buttons */
.delete-btn { background:#dc3545; color:white; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; }
.reminder-btn { background:#25D366; color:white; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; }
.delete-btn:hover, .reminder-btn:hover { opacity:0.85; }

/* Responsive */
@media (max-width:768px) { table { font-size:12px; } .top-buttons { flex-direction:column; } }

/* خطوط الجدول بالأسود */
table { border:2px solid #000; }
th, td { border:2px solid #000; color:#000; }
</style>

<!-- مكتبة SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

<h1>إدارة المشتركين</h1>

<div class="top-buttons">
  <input type="file" id="importFile" style="display:none" accept=".xlsx,.xls">
  <button class="home-btn" onclick="document.getElementById('importFile').click()">استيراد من Excel</button>
</div>

<div class="search-filter">
  <input id="search" placeholder="بحث..." onkeyup="renderTable()">
  <select id="filterStatus" onchange="renderTable()">
    <option value="all">الكل</option>
    <option value="full">مدفوع كليًا</option>
    <option value="partial">مدفوع جزئيًا</option>
    <option value="unpaid">غير مدفوع</option>
  </select>
</div>

<table>
<thead>
<tr>
<th>#</th><th>الاسم</th><th>الهاتف</th><th>العنوان</th>
<th>السعر</th><th>المدفوع</th><th>المتبقي</th>
<th>الحالة</th><th> تذكير واتساب</th><th>حذف</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script>
let subscribers = [];

// عرض الجدول
function renderTable(){
  const s = document.getElementById("search").value.toLowerCase();
  const f = document.getElementById("filterStatus").value;
  const tableBody = document.getElementById("tableBody");
  tableBody.innerHTML = "";

  subscribers.filter(sub=>{
    const rem = sub.price - (sub.paid || 0);
    let st="unpaid"; if(rem==0) st="full"; else if(rem<sub.price) st="partial";
    return (f=="all"||f==st) && (sub.name.toLowerCase().includes(s)||sub.phone.includes(s));
  }).forEach((sub,i)=>{
    const rem = sub.price - (sub.paid || 0);
    let txt="غير مدفوع", cls="status-unpaid";
    if(rem==0){txt="مدفوع كليًا"; cls="status-full";}
    else if(rem<sub.price){txt="جزئي"; cls="status-partial";}

    tableBody.innerHTML += `
<tr>
<td>${i+1}</td>
<td>${sub.name}</td>
<td>${sub.phone}</td>
<td>${sub.address}</td>
<td>$${sub.price}</td>
<td>$${sub.paid||0}</td>
<td>$${rem}</td>
<td class="${cls}">${txt}</td>
<td>${rem>0?`<button class="reminder-btn"> تذكير واتساب </button>`:"✔"}</td>
<td><button class="delete-btn">حذف</button></td>
</tr>`;
  });
}

// استيراد Excel
document.getElementById('importFile').addEventListener('change', function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();

  reader.onload = function(evt){
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data,{type:'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet,{defval:""});

    let count=0;
    subscribers=[];

    json.forEach(row=>{
      const name = (row["الاسم"]||"").toString().trim();
      const phone = (row["الهاتف"]||"").toString().trim();
      const address = (row["العنوان"]||"").toString().trim();
      const price = Number(row["السعر"]||0);

      if(name && phone && price>0){
        subscribers.push({name, phone, address, price, paid:0});
        count++;
      }
    });

    renderTable();
    alert(`تم استيراد ${count} مشترك${count>1?"ين":""} بنجاح!`);
    e.target.value="";
  };

  reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>
