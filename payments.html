<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع - FAST NET</title>

<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; padding:20px; direction:rtl; }
h1 { text-align:center; margin-bottom:20px; }

#search, #filterStatus {
    padding:8px;
    width:100%;
    max-width:400px;
    display:block;
    margin:10px auto;
}

table { width:100%; border-collapse:collapse; background:white; }
th, td { padding:10px; border:1px solid #ddd; text-align:center; }
th { background:#007bff; color:white; }

button { padding:5px 10px; border:none; border-radius:4px; cursor:pointer; }
.pay-btn { background:#ffc107; color:white; }
.print-btn { background:#28a745; color:white; }
.wa-btn { background:#25d366; color:white; }
.back-btn { background:#34495e; color:white; margin-bottom:10px; }

.status-paid,
.status-partial,
.status-unpaid {
    color:white;
    font-weight:bold;
    padding:5px 8px;
    border-radius:5px;
    display:inline-block;
    min-width:110px;
}

.status-paid { background:#388e3c; }
.status-partial { background:#f57c00; }
.status-unpaid { background:#c62828; }
</style>
</head>

<body>

<h1>الدفع - FAST NET</h1>
<button class="back-btn" onclick="location.href='index.html'">العودة للرئيسية</button>

<input id="search" placeholder="ابحث بالاسم أو الهاتف" onkeyup="renderTable()">
<select id="filterStatus" onchange="renderTable()">
    <option value="all">الكل</option>
    <option value="full">مدفوع كليًا</option>
    <option value="partial">مدفوع جزئيًا</option>
    <option value="unpaid">غير مدفوع</option>
</select>

<table>
<thead>
<tr>
<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>العنوان</th>
<th>سعر الاشتراك</th>
<th>المدفوع</th>
<th>المتبقي</th>
<th>الحالة</th>
<th>دفع</th>
<th>طباعة</th>
</tr>
</thead>
<tbody id="subscribersTable"></tbody>
</table>

<script>
// ✅ تحميل البيانات بدون تعديلها
let subscribers = JSON.parse(localStorage.getItem("subscribers")) || [];

// ====== عرض الجدول ======
function renderTable(){
    const body = document.getElementById("subscribersTable");
    const search = document.getElementById("search").value.toLowerCase();
    const filter = document.getElementById("filterStatus").value;
    body.innerHTML = "";

    subscribers.forEach(sub => {
        const paid = (sub.payments || []).reduce((s,p)=>s+Number(p.amount),0);
        const remaining = (sub.price - paid).toFixed(2);

        let status="unpaid", cls="status-unpaid", text="غير مدفوع";
        if(remaining==0){ status="full"; cls="status-paid"; text="مدفوع كليًا"; }
        else if(remaining<sub.price){ status="partial"; cls="status-partial"; text="مدفوع جزئيًا"; }

        if(filter!=="all" && filter!==status) return;
        if(!sub.name.toLowerCase().includes(search) && !sub.phone.includes(search)) return;

        body.innerHTML += `
        <tr>
            <td>${sub.id}</td>
            <td>${sub.name}</td>
            <td>${sub.phone}</td>
            <td>${sub.address}</td>
            <td>$${sub.price}</td>
            <td>$${paid.toFixed(2)}</td>
            <td>$${remaining}</td>
            <td><span class="${cls}">${text}</span></td>
            <td>
                <input type="number" id="pay-${sub.id}" min="1" max="${remaining}">
                <button class="pay-btn" onclick="pay(${sub.id})">دفع</button>
            </td>
            <td><button class="print-btn" onclick="printReceipt(${sub.id})">طباعة</button></td>
        </tr>`;
    });
}

// ====== دفع ======
function pay(id){
    const sub=subscribers.find(s=>s.id===id);
    const amount=Number(document.getElementById(`pay-${id}`).value);
    if(!amount||amount<=0) return alert("مبلغ غير صالح");

    sub.payments=sub.payments||[];
    sub.payments.push({amount,date:new Date().toLocaleDateString()});
    localStorage.setItem("subscribers",JSON.stringify(subscribers));
    renderTable();
}

// ====== طباعة ======
function printReceipt(id){
    const sub=subscribers.find(s=>s.id===id);
    if(!sub.payments?.length) return alert("لا توجد دفعات");
    const p=sub.payments.at(-1);

    const w=window.open("","","width=220");
    w.document.write(`
    <h3>FAST NET</h3>
    <p>الاسم: ${sub.name}</p>
    <p>الهاتف: ${sub.phone}</p>
    <p>العنوان: ${sub.address}</p>
    <p>المدفوع: $${p.amount}</p>
    <p>التاريخ: ${p.date}</p>
    <script>window.print()<\/script>
    `);
}

renderTable();
</script>

</body>
</html>
