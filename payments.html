<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع - FAST NET</title>
<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; padding:20px; direction:rtl; }
h1 { text-align:center; margin-bottom:20px; }
#search, #filterStatus { padding:8px; width:100%; max-width:400px; display:block; margin:10px auto; border-radius:5px; border:1px solid #ccc; }
table { width:100%; border-collapse:collapse; margin-top:10px; background:white; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
th, td { padding:10px; border:1px solid #ddd; text-align:center; }
th { background-color:#007bff; color:white; }
button { padding:5px 10px; cursor:pointer; margin:2px; border-radius:4px; border:none; }
.pay-btn { background-color:#ffc107; color:white; }
.print-btn { background-color:#28a745; color:white; }
.wa-btn { background-color:#25d366; color:white; }
.back-btn { background-color:#34495e; color:white; padding:5px 10px; margin-bottom:10px; }
input[type=number] { width:70px; text-align:center; border-radius:4px; border:1px solid #ccc; }

.status-paid { background-color: #388e3c; color: white; font-weight: bold; border-radius: 4px; padding: 2px 5px; }
.status-partial { background-color: #f57c00; color: white; font-weight: bold; border-radius: 4px; padding: 2px 5px; }
.status-unpaid { background-color: #c62828; color: white; font-weight: bold; border-radius: 4px; padding: 2px 5px; }
</style>
</head>
<body>

<h1>الدفع - FAST NET</h1>
<button class="back-btn" onclick="window.location.href='index.html'">العودة للرئيسية</button>

<input type="text" id="search" placeholder="ابحث بالإسم أو رقم الهاتف...">
<select id="filterStatus">
    <option value="all">الكل</option>
    <option value="full">مدفوع كليًا</option>
    <option value="partial">مدفوع جزئيًا</option>
    <option value="unpaid">غير مدفوع</option>
</select>

<table>
<thead>
<tr>
<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>العنوان</th>
<th>سعر الاشتراك</th>
<th>المدفوع</th>
<th>المتبقي</th>
<th>حالة الدفع</th>
<th>الشهر</th>
<th>دفع</th>
<th>طباعة</th>
<th>واتساب</th>
</tr>
</thead>
<tbody id="subscribersTable"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAolIz4UgOSbV1oe0XTl8a8pVfg7Pnfs1w",
  authDomain: "pos2026-310b7.firebaseapp.com",
  databaseURL: "https://pos2026-310b7-default-rtdb.firebaseio.com",
  projectId: "pos2026-310b7",
  storageBucket: "pos2026-310b7.appspot.com",
  messagingSenderId: "221592625111",
  appId: "1:221592625111:web:81b9704a1fa790bcd0f592"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const tableBody = document.getElementById("subscribersTable");
const searchInput = document.getElementById("search");
const filterStatus = document.getElementById("filterStatus");

let subscribers = [];

function renderTable(){
    const searchFilter = searchInput.value.toLowerCase();
    const statusFilterValue = filterStatus.value;
    tableBody.innerHTML = "";

    subscribers.forEach(sub => {
        const paid = sub.payments.reduce((sum,p)=>sum+Number(p.amount||0),0);
        const remaining = +(sub.price - paid).toFixed(2);
        const status = remaining===0 ? "full" : (remaining<sub.price ? "partial" : "unpaid");

        if(!(statusFilterValue==="all" || status===statusFilterValue)) return;
        if(!(sub.name.toLowerCase().includes(searchFilter) || sub.phone.includes(searchFilter))) return;

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${sub.id}</td>
            <td>${sub.name}</td>
            <td>${sub.phone}</td>
            <td>${sub.address}</td>
            <td>$${sub.price}</td>
            <td>$${paid.toFixed(2)}</td>
            <td>$${remaining}</td>
            <td class="status-cell"></td>
            <td><select class="month-select">${[...Array(12)].map((_,i)=>`<option value="${i+1}">${i+1}</option>`).join("")}</select></td>
            <td>
                <input type="number" class="pay-input" min="0.01" max="${remaining}" step="0.01" ${remaining===0?"disabled":""}>
                <button class="pay-btn" ${remaining===0?"disabled":""}>دفع</button>
            </td>
            <td><button class="print-btn">طباعة</button></td>
            <td><button class="wa-btn">واتساب</button></td>
        `;

        // تحديث حالة الدفع
        const statusCell = tr.querySelector(".status-cell");
        statusCell.innerHTML = remaining===0 ? '<span class="status-paid">مدفوع كليًا</span>' :
                                remaining<sub.price ? '<span class="status-partial">مدفوع جزئيًا</span>' :
                                '<span class="status-unpaid">غير مدفوع</span>';

        // زر الدفع
        const payBtn = tr.querySelector(".pay-btn");
        const payInput = tr.querySelector(".pay-input");
        const monthSelect = tr.querySelector(".month-select");

        payBtn.addEventListener("click", ()=>{
            const amount = parseFloat(payInput.value);
            if(isNaN(amount) || amount<=0 || amount>remaining){
                return alert(`الرجاء إدخال مبلغ صالح. الحد الأقصى: $${remaining}`);
            }
            const month = monthSelect.value;
            const date = new Date().toLocaleDateString();
            sub.payments.push({amount, month, date});
            update(ref(db, "subscribers/"+sub.fid), {payments: sub.payments}).then(()=>{
                // تحديث الصف فقط
                const newPaid = sub.payments.reduce((sum,p)=>sum+Number(p.amount||0),0).toFixed(2);
                const newRemaining = +(sub.price - newPaid).toFixed(2);
                tr.cells[5].innerText = `$${newPaid}`;
                tr.cells[6].innerText = `$${newRemaining}`;
                statusCell.innerHTML = newRemaining===0 ? '<span class="status-paid">مدفوع كليًا</span>' :
                                        newRemaining<sub.price ? '<span class="status-partial">مدفوع جزئيًا</span>' :
                                        '<span class="status-unpaid">غير مدفوع</span>';
                payInput.value = "";
                payInput.max = newRemaining;
                if(newRemaining===0){
                    payInput.disabled = true;
                    payBtn.disabled = true;
                }
                sendWhatsApp(sub, amount, month);
            });
        });

        // زر الطباعة
        const printBtn = tr.querySelector(".print-btn");
        printBtn.addEventListener("click", ()=>{
            if(sub.payments.length===0) return alert("لا توجد دفعات");
            const last = sub.payments[sub.payments.length-1];
            const totalPaid = sub.payments.reduce((sum,p)=>sum+Number(p.amount||0),0);
            const remainingPrint = +(sub.price - totalPaid).toFixed(2);

            const win = window.open("", "", "width=220,height=500");
            win.document.write(`
            <div style="font-family:Arial, sans-serif; width:200px; padding:5px; direction:rtl; text-align:right; font-size:12px;">
                <h3 style="text-align:center; margin:0;">FAST NET</h3>
                <hr>
                <table style="width:100%; border-collapse:collapse; direction:rtl; text-align:right; font-size:12px;">
                    <tr><td>الاسم:</td><td>${sub.name}</td></tr>
                    <tr><td>العنوان:</td><td>${sub.address}</td></tr>
                    <tr><td>المدفوع:</td><td>$${last.amount}</td></tr>
                    <tr><td>المتبقي:</td><td>$${remainingPrint}</td></tr>
                    <tr><td>الشهر:</td><td>${last.month}</td></tr>
                    <tr><td>التاريخ:</td><td>${last.date}</td></tr>
                </table>
                <hr>
                <p style="text-align:center; font-weight:bold;"></p>
            </div>
            `);
            win.print();
        });

        // زر واتساب
        const waBtn = tr.querySelector(".wa-btn");
        waBtn.addEventListener("click", ()=> sendWhatsApp(sub));

        tableBody.appendChild(tr);
    });

    if(tableBody.innerHTML==="") tableBody.innerHTML=`<tr><td colspan="12">لا يوجد مشتركين مطابقين.</td></tr>`;
}

/* واتساب */
function sendWhatsApp(sub, amount=null, month=null){
    if(sub.payments.length===0) return alert("لا توجد دفعات");
    const last = sub.payments[sub.payments.length-1];
    amount = amount ?? last.amount;
    month = month ?? last.month;
    const totalPaid = sub.payments.reduce((sum,p)=>sum+Number(p.amount||0),0);
    const remaining = +(sub.price - totalPaid).toFixed(2);
    const date = last.date;
    let phone = sub.phone.startsWith("+") ? sub.phone : "+961"+sub.phone;

    const msg = `📩 إشعار دفع FAST NET
👤 الاسم: ${sub.name}
📍 العنوان: ${sub.address}
💰 المدفوع : $${amount}
💵 المتبقي: $${remaining}
🗓️ الشهر: ${month}
📅 التاريخ: ${date}`;

    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
}

// تحميل البيانات من Firebase
onValue(ref(db,"subscribers"), snap=>{
    const data = snap.val() || {};
    subscribers = Object.entries(data).map(([fid, sub], i)=>({
        fid,
        id: i+1,
        name: sub.name || "بدون اسم",
        phone: sub.phone || "غير محدد",
        address: sub.address || "غير محدد",
        price: Number(sub.price || 0),
        payments: Array.isArray(sub.payments) ? sub.payments : []
    }));
    renderTable();
});

searchInput.addEventListener("input", renderTable);
filterStatus.addEventListener("change", renderTable);

</script>
</body>
</html>
