<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - FAST NET</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:0; }
header { background:#007bff; color:white; padding:15px; text-align:center; }
header h1 { margin:0; font-size:1.8em; }
nav ul { list-style:none; padding:0; display:flex; justify-content:center; margin:10px 0 0 0; flex-wrap:wrap; }
nav ul li { margin:0 10px; }
nav ul li a {
  color:white; 
  text-decoration:none; 
  padding:20px 30px; /* تكبير الأزرار */
  border-radius:6px;
  font-size:2em; /* حجم الخط أكبر */
  font-weight:800; /* لجعل النص أوضح */
  transition: background 0.3s;
}
nav ul li a.active, nav ul li a:hover { 
  background-color:#0056b3; 
}
main { padding:20px; max-width:1200px; margin:auto; }
.dashboard { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; }
.card { background:white; padding:20px; border-radius:8px; flex:1 1 200px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
.card h2 { margin:0 0 10px 0; font-size:2em; }
.quick-links { text-align:center; margin-top:20px; }
.delete-all-btn { background:#e74c3c; color:white; padding:10px 16px; border:none; border-radius:5px; cursor:pointer; margin-top:10px; }
footer { text-align:center; padding:15px; background:#f1f1f1; margin-top:30px; }
</style>
</head>
<body>

<!-- حماية الصفحة -->
<script>
if(localStorage.getItem("auth") !== "1"){
  location.href = "login.html";
}
</script>

<header>
<h1>لوحة التحكم - FAST NET</h1>
<nav>
<ul>
<li><a href="index.html" class="active">الرئيسية</a></li>
<li><a href="subscribers.html">المشتركين</a></li>
<li><a href="payments.html">الدفع</a></li>
<li><a href="receipts.html">الإيصالات</a></li>
</ul>
</nav>
</header>

<main>
<section class="dashboard">
<div class="card">
<h2 id="totalSubscribers">0</h2>
<p>عدد المشتركين</p>
</div>
<div class="card">
<h2 id="totalReceipts">0</h2>
<p>عدد الإيصالات</p>
</div>
<div class="card">
<h2 id="totalRevenue">$0.00</h2>
<p>إجمالي الإيرادات بالدولار</p>
</div>
</section>

<section class="quick-links">
<button id="deleteAllBtn" class="delete-all-btn">حذف جميع البيانات</button>
<button onclick="logout()" class="delete-all-btn" style="background:#555;">تسجيل خروج</button>
</section>
</main>

<footer>
<p>© 2026 FAST NET. جميع الحقوق محفوظة.</p>
</footer>

<!-- 🔥 Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, remove }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAolIz4UgOSbV1oe0XTl8a8pVfg7Pnfs1w",
  authDomain: "pos2026-310b7.firebaseapp.com",
  databaseURL: "https://pos2026-310b7-default-rtdb.firebaseio.com",
  projectId: "pos2026-310b7",
  storageBucket: "pos2026-310b7.appspot.com",
  messagingSenderId: "221592625111",
  appId: "1:221592625111:web:81b9704a1fa790bcd0f592"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// تسجيل الخروج
window.logout = function(){
  localStorage.removeItem("auth");
  location.href = "login.html";
};

// جلب المشتركين
onValue(ref(db, "subscribers"), snapshot => {
  const data = snapshot.val() || {};
  const subscribers = Object.values(data);

  document.getElementById("totalSubscribers").textContent = subscribers.length;

  let totalRevenue = 0;
  subscribers.forEach(sub => {
    const paid = sub.payments
      ? Object.values(sub.payments).reduce((s,p)=>s+Number(p.amount||0),0)
      : 0;
    totalRevenue += paid;
  });

  document.getElementById("totalRevenue").textContent =
    `$${totalRevenue.toFixed(2)}`;
});

// جلب الإيصالات
onValue(ref(db, "receipts"), snapshot => {
  const data = snapshot.val() || {};
  document.getElementById("totalReceipts").textContent =
    Object.keys(data).length;
});

// حذف جميع البيانات
document.getElementById("deleteAllBtn").onclick = () => {
  if(confirm("هل أنت متأكد من حذف جميع البيانات؟")){
    remove(ref(db));
    alert("تم حذف جميع البيانات");
  }
};
</script>

</body>
</html>
