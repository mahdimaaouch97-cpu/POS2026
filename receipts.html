<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإيصالات - FAST NET</title>

<style>
body { font-family: Arial; background: #f5f5f5; direction: rtl; margin:0; padding:20px;}
.container { max-width:1000px; margin:auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
h1 { text-align:center; margin-bottom:20px; font-size:24px;}
.controls { display:flex; justify-content:space-between; flex-wrap:wrap; margin-bottom:15px;}
.controls input, .controls select { padding:8px 10px; font-size:14px; border:1px solid #ccc; border-radius:5px; margin:5px 0; flex:1; min-width:150px;}
table { width:100%; border-collapse:collapse; font-size:13px;}
th, td { border:1px solid #ddd; padding:8px; text-align:right; vertical-align:middle;}
th { background:#007bff; color:#fff;}
.status-label { padding:3px 7px; border-radius:4px; color:#fff; font-size:12px; display:inline-block;}
.status-full { background:#28a745; }
.status-partial { background:#ffc107; color:#000; }
.status-none { background:#dc3545; }
.print-btn { padding:5px 10px; font-size:12px; cursor:pointer; border:none; background:#007bff; color:#fff; border-radius:4px;}
.print-btn:hover { background:#0056b3;}
.back-btn { padding:15px 25px; font-size:18px; margin-bottom:20px; border:none; border-radius:8px; background:#007bff; color:#fff; cursor:pointer;}
.back-btn:hover { background:#0056b3;}
</style>
</head>

<body>

<div class="container">
<button class="back-btn" onclick="window.location.href='index.html'">العودة للرئيسية</button>
<h1>قائمة الإيصالات</h1>

<div class="controls">
    <input type="text" id="search" placeholder="بحث بالاسم...">
    <select id="filterStatus">
        <option value="all">الكل</option>
        <option value="full">مدفوع كليًا</option>
        <option value="partial">مدفوع جزئيًا</option>
    </select>
</div>

<table>
<thead>
<tr>
<th>رقم الإيصال</th>
<th>المشترك</th>
<th>السعر</th>
<th>المدفوع</th>
<th>المتبقي</th>
<th>الشهر</th>
<th>الحالة</th>
<th>تاريخ الدفع</th>
<th>طباعة</th>
</tr>
</thead>
<tbody id="receiptsTableBody"></tbody>
</table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase Config */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "pos2026-310b7.firebaseapp.com",
  databaseURL: "https://pos2026-310b7-default-rtdb.firebaseio.com",
  projectId: "pos2026-310b7",
  storageBucket: "pos2026-310b7.appspot.com",
  messagingSenderId: "221592625111",
  appId: "1:221592625111:web:81b9704a1fa790bcd0f592"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const tableBody = document.getElementById("receiptsTableBody");
const searchInput = document.getElementById("search");
const filterSelect = document.getElementById("filterStatus");

let receipts = [];

onValue(ref(db, "subscribers"), snap => {
    const data = snap.val() || {};
    receipts = [];

    Object.values(data).forEach(sub => {
        if(!sub.payments) return;
        sub.payments.forEach(p => {
            const totalPaid = sub.payments.slice(0, sub.payments.indexOf(p)+1)
                                 .reduce((a,b)=>a+b.amount,0);
            const remaining = +(sub.price - totalPaid).toFixed(2);
            receipts.push({
                receiptNumber: p.receiptNumber || '-',
                name: sub.name || "بدون اسم",
                address: sub.address || "غير محدد",
                total: Number(sub.price || 0),
                amount: p.amount,
                remaining: remaining,
                month: p.month,
                date: p.date
            });
        });
    });

    renderTable();
});

function renderTable() {
    const search = searchInput.value.toLowerCase();
    const filter = filterSelect.value;
    tableBody.innerHTML = "";

    let filtered = receipts.filter(r=>{
        const matchSearch = r.name.toLowerCase().includes(search);
        let matchFilter = true;
        if(filter==="full") matchFilter = r.remaining===0;
        if(filter==="partial") matchFilter = r.remaining>0 && r.remaining<r.total;
        return matchSearch && matchFilter;
    });

    if(filtered.length===0){
        tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center;">لا توجد نتائج</td></tr>`;
        return;
    }

    filtered.forEach(r=>{
        let statusClass = "status-none";
        let statusText = "غير مدفوع";
        if(r.remaining===0){statusClass="status-full"; statusText="مدفوع كليًا";}
        else if(r.remaining>0 && r.remaining<r.total){statusClass="status-partial"; statusText="مدفوع جزئيًا";}

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${r.receiptNumber}</td>
            <td>${r.name}</td>
            <td>$${r.total}</td>
            <td>$${r.amount}</td>
            <td>$${r.remaining}</td>
            <td>${r.month}</td>
            <td><span class="status-label ${statusClass}">${statusText}</span></td>
            <td>${r.date}</td>
            <td><button class="print-btn">طباعة</button></td>
        `;

        tr.querySelector(".print-btn").addEventListener("click", ()=>{

            const win = window.open("", "PrintReceipt", "width=400,height=600");

            win.document.write(`
            <html>
            <head>
            <style>
                @page { size: 55mm auto; margin: 0; }
                body {
                    font-family: Arial;
                    direction: rtl;
                    width: 55mm;
                    margin: 0;
                    padding: 4mm;
                    box-sizing: border-box;
                    font-size: 12px;
                }
                table { width:100%; border-collapse:collapse; }
                td { padding:3px 0; word-break: break-word; }
                hr { border:none; border-top:1px dashed #000; margin:6px 0; }
                h2 { text-align:center; margin:0; font-size:15px; }
                .contact { text-align:center; font-size:11px; margin-bottom:5px; }
            </style>
            </head>
            <body onload="window.print(); setTimeout(()=>window.close(),500);">

                <h2>FAST NET</h2>
                <div class="contact">
                    71-338640 📞 71-346411
                </div>

                <hr>

                <table>
                    <tr><td>رقم الإيصال:</td><td>${r.receiptNumber}</td></tr>
                    <tr><td>المشترك:</td><td>${r.name}</td></tr>
                    <tr><td>العنوان:</td><td>${r.address}</td></tr>
                    <tr><td>سعر الاشتراك:</td><td>$${r.total}</td></tr>
                    <tr><td>المدفوع:</td><td>$${r.amount}</td></tr>
                    <tr><td>المتبقي:</td><td>$${r.remaining}</td></tr>
                    <tr><td>الشهر:</td><td>${r.month}</td></tr>
                    <tr><td>حالة الدفع:</td><td>${statusText}</td></tr>
                    <tr><td>تاريخ الدفع:</td><td>${r.date}</td></tr>
                </table>

                <hr>

            </body>
            </html>
            `);

            win.document.close();
        });

        tableBody.appendChild(tr);
    });
}

searchInput.addEventListener("input", renderTable);
filterSelect.addEventListener("change", renderTable);
</script>

</body>
</html>
